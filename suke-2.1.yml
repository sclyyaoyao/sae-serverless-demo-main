        prompt_template:
        - id: 2509a71b-1fb6-4d90-ad86-6bd082995398
          role: system
          text: '# 角色扮演

            你是一位顶级的技术转移与专利商业化专家，拥有超过15年的交通行业从业经验。你深刻理解技术转化的完整生态链，不仅精通技术评估、商业模式和投资分析，更擅长为不同类型的技术持有方匹配最优的产业合作伙伴，包括**设计院、专业的科技成果转化平台/公司**等。你的分析总能精准地结合技术本身、持有方特点和市场环境，提供深刻、务实且可执行的建议。'
        - id: f078443d-b739-4da9-9b46-00ce8c3aa9ed
          role: user
          text: "# 任务\n你的核心任务是，基于我提供的{{#1775116882001.text#}}和一份详细的{{#1776847361419.structured_output#}}，根据{{#1775791639625.text#}}生成一份专业的**专利转化策略分析报告**。报告内容包括：核心洞察提炼、持有人画像、市场与环境解读、五种转化方式逐一分析优势和短板，最后给出结论和建议。\n\
            ---\n\n# 分析逻辑与思考框架 (Chain of Thought)\n在生成最终报告前，你必须严格遵循以下三步分析逻辑：\n\n**第一步：核心洞察提炼\
            \ (Internal Diagnosis)**\n1.  **解读专利自身特性**: 从评估报告的“技术创新性”、“技术成熟度(TRL)”和“专利质量”中，判断该专利的核心属性。回答以下关键问题：\n\
            \    *   **创新层级**: 这是颠覆性创新（高壁垒）还是优化改进（低壁垒）？\n    *   **成熟阶段**: 这是早期概念（TRL\
            \ 1-4，高风险）还是成熟技术（TRL 7-9，低风险）？这是决定策略方向的最关键因素。\n    *   **资产质量**: 专利的保护范围是宽还是窄？稳定性如何？\n\
            \n2.  **解读持有方属性**: 从评估报告的“转化可行性”以及摘要中提到的专利权人信息，根据{{#1776847361419.text#}}针对性分析持有方在本成果转化的优势和劣势，特别是结合{{#1775791639625.text#}}中的致命伤，并给出针对性建议。\n\
            \    *   **主体类型**: 是高校/科研院所（长于研发，短于市场），还是大型企业（资源雄厚，有产业协同需求），或是行业内成果转化平台和公司（充分了解市场需求，具备转化经验和供需资源）？\n\
            \    *   **核心能力**: 持有方是否具备生产、销售、市场渠道等商业化资源？\n *   **劣势及对策**: 持有方在商业化落地方面的短板和弱项，给出相应对策，包括但不限于通过自身培育、寻求合作伙伴等方式。\n\
            \n3.  **解读市场与环境**: 从评估报告的“市场潜力”和“转化可行性”中，判断外部的机会与威胁。回答以下关键问题：\n    * \
            \  **市场格局**: 是蓝海市场（机会多）还是红海市场（竞争激烈）？\n    *   **政策驱动**: 是否有强有力的政策支持（如“海绵城市”、“双碳”战略）？\n\
            \n**第二步：转化路径与合作伙伴契合度分析 (Strategy & Partner-Fit Analysis)**\n基于第一步的综合诊断，你将逐一分析以下五种转化方式。在分析时，必须**紧密关联第一步的洞察**，并**重点思考实现该路径所需的最佳合作伙伴类型**。\n\
            \n*   **合作伙伴类型思考**:\n    *   **设计院**: 核心优势在于**深刻理解行业标准和项目需求**，拥有强大的**技术整合与推广能力**，是技术应用和标准化的关键入口。\n\
            \    *   **科技成果转化平台/公司**: 核心优势在于**全链条服务**，具备**市场洞察、中试熟化、孵化加速、供需资源对接**的全套经验，能极大加速技术的商业化进程。\n\
            \    *   **产业龙头企业**: 拥有雄厚的资金、生产线和市场渠道。\n    *   **施工企业**: **主要作为技术的最终用户而非前端转化伙伴**，其角色偏向应用验证和采购，而非共同开发或商业化推广。\n\
            \n*   **方式一：向他人转让 (Assignment)**\n    *   优点 (Pros): 快速现金回报。\n    *  \
            \ 缺点 (Cons): 放弃未来收益。\n    *   契合度分析 (Fit Analysis): 结合**技术成熟度**和**创新层级**判断其转让价值。若技术成熟度低，潜在买家可能是**专业的成果转化公司**，而非直接的用户企业。\n\
            \n*   **方式二：许可他人使用 (Licensing)**\n    *   优点 (Pros): 保留所有权，获取持续现金流。\n\
            \    *   缺点 (Cons): 监督成本，可能因壁垒低而失控。\n    *   契合度分析 (Fit Analysis): 分析**技术壁垒**和**专利质量**是否足以支撑许可模式。对于行业应用类专利，向**设计院**推广以纳入其设计标准，是一种高效的许可策略。\n\
            \n*   **方式三：作价入股/技术入股 (Equity Investment)**\n    *   优点 (Pros): 深度绑定，分享长期股权价值。\n\
            \    *   缺点 (Cons): 流程复杂，对技术估值要求高。\n    *   契合度分析 (Fit Analysis): 理想的入股对象是**专业的成果转化平台孵化的新公司**，或是与**产业龙头**成立的合资公司。\n\
            \n*   **方式四：自行投资实施转化 (Self-Implementation)**\n    *   优点 (Pros): 收益最大化，完全控制。\n\
            \    *   缺点 (Cons): 资金、资源需求大，风险极高。\n    *   契合度分析 (Fit Analysis): 严格评估**持有方的核心能力**。若持有方是**设计院**，其“自行实施”更多体现为在项目中主导应用和推广，而非自己建厂生产。\n\
            \n*   **方式五：合作开发 (Collaborative Development)**\n    *   优点 (Pros): 风险共担，优势互补。\n\
            \    *   缺点 (Cons): 知识产权归属和利益分配复杂。\n    *   契合度分析 (Fit Analysis): **这是解决“技术成熟度低”问题的首选方案**。最佳合作伙伴是能提供**中试、孵化服务的成果转化平台**，或是能提供真实应用场景和反馈的**设计院**，而非仅仅是施工单位。\n\
            \n**第三步：形成最终结论与建议 (Actionable Recommendations)**\n综合以上所有分析，形成最终的、可执行的建议。\n\
            1.  **推荐策略**: 明确指出首选的转化方式，并**具体说明推荐与哪一类合作伙伴进行合作**，详细阐述为什么这个“组合拳”最能扬长避短，最大化当前阶段的价值。\n\
            2.  **关键风险点**: 针对推荐的策略和合作伙伴类型，识别出最可能导致失败的2-4个核心风险。\n3.  **退出机制**: 设计清晰的、可量化的“止损点”或“转向点”。\n\
            \n---\n# 输出格式要求\n\n请以客观、犀利的投资与转化视角，输出以下结构的《专利成果转化路径建议》：\n\n## 《[专利/成果名称]》转移转化路径建议报告\n\
            \n**一、 成果画像与成熟度定级**\n- **技术成熟度评级：** 第X级（引述标准附录A的具体特征作为评级依据）。\n- **一句话总结：**\
            \ （高度凝练该专利的商业与技术核心卖点）。\n\n**二、 专利人画像**\n{{#1776847361419.text#}}\n- **主体类型**:\
            \ 是高校/科研院所（长于研发，短于市场），还是大型企业（资源雄厚，有产业协同需求），或是行业内成果转化平台和公司（充分了解市场需求，具备转化经验和供需资源）？\n\
            - **核心能力**: 持有方是否具备生产、销售、市场渠道等商业化资源？\n- **劣势及对策**: 持有方在商业化落地方面的短板和弱项，给出相应对策，包括但不限于通过自身培育、寻求合作伙伴等方式。\n\
            \n**三、 市场与环境解读 **\n\n\n**四、 转化路径推演 **\n- **方式一：向他人转让 (Assignment)**\n\
            \    *   优点 (Pros): 快速现金回报。\n    *   缺点 (Cons): 放弃未来收益。\n    *   契合度分析\
            \ (Fit Analysis): 结合**技术成熟度**和**创新层级**判断其转让价值。若技术成熟度低，潜在买家可能是**专业的成果转化公司**，而非直接的用户企业。\n\
            \n- **方式二：许可他人使用 (Licensing)**\n    *   优点 (Pros): 保留所有权，获取持续现金流。\n  \
            \  *   缺点 (Cons): 监督成本，可能因壁垒低而失控。\n    *   契合度分析 (Fit Analysis): 分析**技术壁垒**和**专利质量**是否足以支撑许可模式。对于行业应用类专利，向**设计院**推广以纳入其设计标准，是一种高效的许可策略。\n\
            - **方式四：自行投资实施转化 (Self-Implementation)**\n    *   优点 (Pros): 收益最大化，完全控制。\n\
            \    *   缺点 (Cons): 资金、资源需求大，风险极高。\n    *   契合度分析 (Fit Analysis): 严格评估**持有方的核心能力**。若持有方是**设计院**，其“自行实施”更多体现为在项目中主导应用和推广，而非自己建厂生产。\n\
            \n- **方式五：合作开发 (Collaborative Development)**\n    *   优点 (Pros): 风险共担，优势互补。\n\
            \    *   缺点 (Cons): 知识产权归属和利益分配复杂。\n    *   契合度分析 (Fit Analysis): **这是解决“技术成熟度低”问题的首选方案**。最佳合作伙伴是能提供**中试、孵化服务的成果转化平台**，或是能提供真实应用场景和反馈的**设计院**，而非仅仅是施工单位。\n\
            \n**五、 转化决策建议 **\n1.  **推荐策略**: 明确指出首选的转化方式，并**具体说明推荐与哪一类合作伙伴进行合作**，详细阐述为什么这个“组合拳”最能扬长避短，最大化当前阶段的价值。\n\
            2.  **关键风险点**: 针对推荐的策略和合作伙伴类型，识别出最可能导致失败的2-4个核心风险。\n3.  **退出机制**: 设计清晰的、可量化的“止损点”或“转向点”。"
