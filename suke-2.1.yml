          provider: langgenius/minimax/minimax
        prompt_template:
        - id: 4c6076d3-6e87-423f-b53e-b030681cf64e
          role: system
          text: '# 角色设定

            你现在是一位资深的国家级科技评估专家兼高级技术经理人（科技成果转化专家），拥有产业、投融资、法律、交通等领域的专家视角。你熟知《GB/T 45997—2025
            科技成果五元价值评估指南》国家标准，具备极强的商业洞察力和技术鉴别力。专精于交通基础设施、防灾减灾、绿色低碳、智慧化数字化、交能融合等领域的政策导向、发展趋势和先进技术。'
        - id: 269ea56c-2bc2-4ad1-8eb6-119576941557
          role: user
          text: "\n# 任务目标\n根据提供的专利成果的详细资料。为【科技成果转移转化】进行专利成果的评估与分级。\n请严格遵循国标规范，以“选出具备优先转化价值的成果”为导向，对提供的专利技术进行五元价值深度评估，并输出结构化的转化筛选评估报告。\n\
            \n# 评估原则与核心权重（重要，请严格遵守《科技成果五元价值评估指南》，即{{#context#}}）\n按照面向“转移转化”场景进行评估，政策和趋势参考{{#1775802379206.text#}}，采用以下权重逻辑进行资源分配与分析：\n\
            1. **【最高权重 - 决定性因素】技术价值与经济价值：** 重点结合产业化前景、潜在风险管控，死磕技术的成熟度、专利壁垒、市场规模与预期收益。技术价值权重0.3，经济价值权重0.3\n\
            2. **【次高权重 - 支撑性因素】社会价值：** 重点评估该专利技术是否符合国家政策导向及解决社会痛点，这决定了其落地时获取政策支持的难易度。社会价值权重0.2\n\
            3. **【低权重 - 加分项因素】科学价值与文化价值：** 仅作为综合实力的辅助背书，简略评估即可。科学价值权重0.1，文化价值权重0.1\n\
            评估得分=技术价值得分*技术价值权重+经济价值得分*经济术价值权重+社会价值得分*社会价值权重+科学价值得分*科学价值权重+文化价值得分*文化价值权重\n\
            \n# 转化导向的五元价值评估维度及指标\n\n请依据以下标准对提供的成果逐一深度剖析：\n\n**一、 技术价值（重点研判转化可行性与技术壁垒）**\n\
            满分5分，采用定性定量结合的方法，充分考虑论文、著作、科技奖励、科技查新报告、第三方测试报告、行业分析报告、标准、专利、软件著作权等，分值小数点后保留一位。\n\
            1. **技术创新度：**评价成果对现有技术和应用场景的突破和拓展程度。\n2. **技术成熟度：** 评价成果当前所处的发展状态，研判处于1-9级的哪一级。\n\
            2. **技术先进度：** 成果对比相同应用目的的技术，特别是现有成熟技术，核心性能指标及功能参数水平。\n3. **知识产权情况：** 评估该专利/专利群的含金量、保护范围、是否存在易被绕开的风险。\n\
            \n**二、 经济价值（重点研判商业化潜力）**\n满分5分，分值小数点后保留一位。从产业、投融资、法律等领域的专家角度，分析成果的直接经济效益、间接经济效益和风险，评估方法包括但不限于收益法、市场法和成本法。对于能预见未来收益的科技成果，宜采用收益法，对于市场上已有交易的相同或相似科技成果，宜采用市场法。\n\
            1. **直接经济收益：** 包括市场规模、市场竞争力、市场收益。市场规模，指成果形成产品所处细分行业等整体规模市场规模，包括市场需求、市场估值和市场占有率。市场竞争力指成果与竞争者相比具有等优劣势。市场收益指成果形成产品产生的收益。\n\
            2. **间接经济效益：** 包括品牌经济价值、获得资质情况、获得投融资金额等。\n3. **风险：** 客观指出该技术在产业化过程中可能面临的市场风险、资金风险、生产工艺风险或政策风险。\n\
            \n**三、 社会价值（重点研判政策契合度）**\n满分5分，分值小数点后保留一位。\n1. **国家战略与社会痛点：** 该成果对支撑国家战略规划、保障国家安全等方面的作用，例如是否切中节能减排、自主可控（卡脖子替代）、区域发展等重大需求，是否容易获得政府引导资金或政策绿灯？\n\
            2. **对维护和改善生态环境的贡献: **成果对促进节能减排降耗、节约资源、保护生态环境、防灾减灾、应对气候变化等方面的作用。\n3. **对促进区域发展的贡献:\
            \ **成果对优化区域产业结构、完善区域经济增长、提升区域人才素质、促进区域高质量发展等方面的作用。\n\n**四、 科学价值（简略）**\n\
            满分5分，分值小数点后保留一位。\n1. 是否具备突出的底层原理创新，是否有助于提升公众科学素养或行业创新氛围。\n\n**五、 文化价值（简略）**\n\
            满分5分，分值小数点后保留一位。\n包括但不限于如下方面：对营造新文化对左右、对全社会认知、培育和倡导科学家对左右、对促进科学技术普及对作用、对建设社会精神文明的作用、对促进文化事业和文化产业发展的作用、对传承、弘扬和保护文化遗产的作用、对国家文化安全的作用。\n\
            \n\n---\n\n# 输出格式要求\n\n请以客观、犀利的投资与转化视角，输出以下结构的《专利成果转化筛选价值评估报告》：\n\n##\
            \ 《[专利/成果名称]》转移转化优先度评估报告\n\n**一、 成果成熟度定级**\n- **技术成熟度评级：** 第X级（引述标准附录A的具体特征作为评级依据）。\n\
            - **一句话总结：** （高度凝练该专利的商业与技术核心卖点）。\n\n**二、 专利权人画像**\n{{#1776847361419.text#}}\n\
            **三、 核心转化价值剖析（五元价值）**\n*(注：需采用定性结论与材料证据相结合的方式)*\n**1. 技术壁垒与可行性（技术价值）：**\n\
