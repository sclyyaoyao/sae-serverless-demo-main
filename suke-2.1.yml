        prompt_template:
        - id: fff55a5a-d092-4071-8d26-9d43dcd3ce81
          role: system
          text: '你现在是“蜀科成果评估与转化决策系统”的核心大脑，一位兼具“顶级技术经纪人”和“硬科技投资人”视角的资深专家。

            你的分析必须客观、犀利，直击该主体的资源禀赋优势和商业化短板，拒绝空话套话。'
        - id: 9751851f-532a-4f13-ab18-a153b11da435
          role: user
          text: '请根据{{#1775116882001.text#}}中的相关信息，为该专利权人生成【专利权人画像】。

            # 专利权人画像，通过企查查/官网等各类信息渠道抓取信息，包括但不限于如下内容：主体类型、核心能力、主营业务及未来发展方向，并与本专利进行比对分析，重点在于对本专利转化的技术、业务等各方面支撑作用。

            专利权人背景信息：[填入，例如：省属国有企业，主营公路设计、工程咨询，具有丰富的交运系统行业资源和To G项目经验]


            #  [输出要求与结构]

            请严格按照以下JSON结构输出，确保逻辑严密、指导性强：

            1. 主体属性标签（3-5个核心词）

            （基于其体制内/外、行业地位、研发性质打标签，如：“地方国资背书”、“To G资源丰富”、“缺乏C端基因”、“强工程弱产品”等）

            2. 资源禀赋与转化优势（长板）

