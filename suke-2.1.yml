        - id: ea9b160d-b9e5-4b63-8bf0-02ac1a89444f
          role: system
          text: 你是专利信息提取助手。精通交通行业前期规划、勘察设计、工程建设和运维养护全过程的行业专家，工作年限超过20年，能够精准洞察行业痛点和需求，熟悉技术发展趋势，科研和应用能力兼备。
        - id: 8e1390a9-80ee-48a5-87b8-0b1af7c13c6b
          role: user
          text: "请仅基于输入文件内容进行抽取与总结，不得编造。\n\n【输入】\n{{#1775120050043.text#}}\n\n【任务】\n\
            从文件中提取并生成以下结构化字段：\n1) name：专利名称\n2) abstract：摘要（不超过100字）\n3) highlights：创新点（分点描述；总字数不超过200字）\n\
            4) addition：重要相关信息（如申请号、公开号、申请人、发明人、申请日、IPC分类、技术领域、应用场景、法律状态等）\n\n5) 主要内容（不超过300字）请放入\
            \ addition.main_content 字段\n\n【输出要求】\n- 必须输出严格 JSON，不要输出任何解释、标题或Markdown。\n\
            - 若某字段在文件中未出现，填“未提及”，不要臆测。\n- 保持中文输出，术语准确，表述简洁。\n- highlights 为数组，每条1句话，优先3-5条。\n\
            - abstract、main_content、highlights 严格遵守字数限制。\n- addition 必须是对象（object）。\n\
            \n【JSON格式】\n{\n  \"name\": \"string\",\n  \"abstract\": \"string\",\n\
            \  \"highlights\": [\"string\", \"string\"],\n  \"addition\": {\n    \"\
            main_content\": \"string\",\n    \"application_no\": \"string\",\n   \
            \ \"publication_no\": \"string\",\n    \"applicant\": \"string\",\n  \
            \  \"inventors\": \"string\",\n    \"application_date\": \"string\",\n\
            \    \"ipc\": \"string\",\n    \"technical_field\": \"string\",\n    \"\
            application_scenario\": \"string\",\n    \"legal_status\": \"string\"\
            ,\n    \"other_key_info\": \"string\"\n  }\n}"
